<title>HireFlow AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: owner workspace on the left, the candidate's WhatsApp on the right, like a café counter with a phone beside it. */
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --sunk:#F1EDE4; --ink:#16201C; --muted:#5B6862; --line:#D9E1DB;
  --brand:#0E7A55; --brand-ink:#0A5A3F; --brand-soft:#DCF0E5; --on-brand:#FFFFFF;
  --warn:#A9531A; --warn-soft:#FBE7D8; --bad:#A43A2C; --bad-soft:#F7DFDA; --gold:#E9C46A; --gold-soft:#FBF1D6;
  --chat:#E6EDE7; --bubble-in:#FFFFFF; --bubble-out:#D3F1E0; --chat-head:#0E5C42;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif; --body:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --coral:#E85D3F; --coral-soft:#FFE4DB; --coral-ink:#B23A1F;
  --sky:#2F7FD0; --sky-soft:#DDECFC; --sky-ink:#1D5FA3;
  --grape:#6F52D9; --grape-soft:#ECE6FF; --grape-ink:#5136B8;
  --sun:#E8A51C; --sun-soft:#FFF0C7; --sun-ink:#8A5A00;
  --pink:#D6478A; --pink-soft:#FFE0EE; --pink-ink:#A82D68;
  --blob1:#FFE7B8; --blob2:#E3DBFF; --blob3:#CFF0DF; --dotc:rgba(14,92,66,.09);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201C; --sunk:#111916; --ink:#E6EEE9; --muted:#9AABA2; --line:#2A3631;
  --brand:#3DB487; --brand-ink:#7FD1AE; --brand-soft:#163A2C; --on-brand:#08140F;
  --warn:#E89A62; --warn-soft:#3A2416; --bad:#EE8A7B; --bad-soft:#3B1C17; --gold:#E9C46A; --gold-soft:#36301B;
  --chat:#0D1311; --bubble-in:#1C2723; --bubble-out:#174332; --chat-head:#123A2C; --coral:#FF8A6B; --coral-soft:#3E2019; --coral-ink:#FFB49F;
  --sky:#6AAEF0; --sky-soft:#16283C; --sky-ink:#A8CFF7;
  --grape:#A08BFF; --grape-soft:#251E44; --grape-ink:#C9BDFF;
  --sun:#F2C14E; --sun-soft:#3A2F12; --sun-ink:#F6D788;
  --pink:#F07BB1; --pink-soft:#3D1A2B; --pink-ink:#F7AFD0;
  --blob1:#2C2411; --blob2:#211B3A; --blob3:#123026; --dotc:rgba(255,255,255,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201C; --sunk:#111916; --ink:#E6EEE9; --muted:#9AABA2; --line:#2A3631;
  --brand:#3DB487; --brand-ink:#7FD1AE; --brand-soft:#163A2C; --on-brand:#08140F;
  --warn:#E89A62; --warn-soft:#3A2416; --bad:#EE8A7B; --bad-soft:#3B1C17; --gold:#E9C46A; --gold-soft:#36301B;
  --chat:#0D1311; --bubble-in:#1C2723; --bubble-out:#174332; --chat-head:#123A2C; --coral:#FF8A6B; --coral-soft:#3E2019; --coral-ink:#FFB49F;
  --sky:#6AAEF0; --sky-soft:#16283C; --sky-ink:#A8CFF7;
  --grape:#A08BFF; --grape-soft:#251E44; --grape-ink:#C9BDFF;
  --sun:#F2C14E; --sun-soft:#3A2F12; --sun-ink:#F6D788;
  --pink:#F07BB1; --pink-soft:#3D1A2B; --pink-ink:#F7AFD0;
  --blob1:#2C2411; --blob2:#211B3A; --blob3:#123026; --dotc:rgba(255,255,255,.05); color-scheme:dark}
*{box-sizing:border-box}
html{min-height:100%}
body{min-height:100vh}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px}
.logo small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:block;margin-top:-2px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.vsel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;max-width:260px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.phone-col{order:-1}}
.mobile-switch{display:none}
@media (max-width:980px){.mobile-switch{display:flex;margin-bottom:12px}.grid[data-show="owner"] .phone-col{display:none}.grid[data-show="phone"] .owner-col{display:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.vhead{padding:18px 20px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;border-bottom:1px solid var(--line)}
.vhead h1{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.vhead .meta{color:var(--muted);font-size:13.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--gold-soft);color:var(--warn)}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabpanel{padding:18px 20px 22px}

/* hero: today at a glance */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:center;background:var(--brand-soft);border-radius:18px;padding:20px 22px;position:relative;overflow:hidden}
.hero h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 12px;text-wrap:balance}
.big{display:flex;flex-wrap:wrap;gap:10px 26px}
.big div{min-width:0}
.big b{display:block;font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.big span{font-size:12.5px;color:var(--muted)}
.cupwrap{justify-self:center;position:relative;width:120px;height:130px}
.cupwrap svg{width:120px;height:130px;overflow:visible}
.steam path{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;opacity:.45}
@media (prefers-reduced-motion:no-preference){.steam path{animation:steam 3s ease-in-out infinite}.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.5}100%{transform:translateY(-10px);opacity:0}}}
.cuplabel{position:absolute;left:0;right:0;top:80px;text-align:center;font-family:var(--display);font-size:17px;color:var(--on-brand);font-weight:600}
.cupcap{text-align:center;font-size:11.5px;color:var(--muted);margin-top:-4px}
.bean{position:absolute;width:18px;height:12px;border-radius:50%;background:var(--warn);opacity:.25;transform:rotate(-25deg)}
.bean::after{content:"";position:absolute;left:8px;top:2px;width:2px;height:8px;border-radius:2px;background:var(--brand-soft)}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.hero > div:last-child{display:none}}
/* pipeline */
.pipe{display:flex;align-items:flex-start;margin:18px 2px 6px;gap:0}
.pipe .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.pipe .st::before{content:"";position:absolute;top:16px;left:-50%;right:50%;height:3px;background:var(--line)}
.pipe .st:first-child::before{display:none}
.pipe .st.on::before{background:var(--brand)}
.pipe .dot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pipe .st.on .dot{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.pipe small{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2}
/* candidate list */
.listhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:18px 0 8px}
.listhead h2,.sec h2{font-size:15px;margin:0;font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.crow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px}
@media (max-width:640px){.crow{grid-template-columns:40px minmax(0,1fr) auto}.crow .acts{grid-column:1/-1;justify-content:flex-start;padding-left:52px}}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px;color:#fff}
.cname{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.cname span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conds{display:flex;gap:4px}
.cond{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.cond svg{width:15px;height:15px}
.cond.no{background:var(--bad-soft);color:var(--bad)}
.cond.wait{background:var(--sunk);color:var(--muted)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sdot.good{background:var(--brand)}.sdot.warn{background:var(--warn)}.sdot.bad{background:var(--bad)}.sdot.gold{background:var(--gold)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--brand-soft);color:var(--brand-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.icon{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:50%}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input.slot{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;width:120px;font-size:13px}
.detail{padding:4px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;border-top:1px dashed var(--line)}
@media (max-width:720px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;font-weight:600}
.morebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.timeline{list-style:none;margin:0;padding:0;font-size:13px}
.timeline li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums}
.transcript{background:var(--chat);border-radius:10px;padding:10px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.empty svg{width:70px;height:70px;display:block;margin:0 auto 8px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:6px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* retention */
table.ret{width:100%;border-collapse:collapse;font-size:13.5px}
table.ret th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);padding:8px 6px}
table.ret td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:middle}
.tbl{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--warn);border-radius:6px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.sec{margin-top:22px}
.note{font-size:13px;color:var(--muted);max-width:68ch}

/* forms */
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (max-width:720px){form.f{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:500;cursor:pointer}
.days input{accent-color:var(--brand)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{display:inline-flex;align-items:center;justify-content:center;min-width:42px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:500}
.scale label{position:relative}
.scale input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.scale input:checked + span{color:var(--brand-ink);font-weight:700}
.scale label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.formfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.linkbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13.5px}
.linkbox code{font-size:13px;word-break:break-all}
.fbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:720px){.fbgrid{grid-template-columns:minmax(0,1fr)}}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{font-family:var(--display);font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.fblist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fbitem{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.fbitem .m{color:var(--muted);font-size:12px}

/* phone */
.phone{border-radius:28px;background:var(--ink);padding:10px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.screen{border-radius:20px;overflow:hidden;background:var(--chat);display:flex;flex-direction:column;height:min(720px,calc(100vh - 120px));min-height:520px}
.phead{background:var(--chat-head);color:#F1F7F3;padding:10px 12px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:#F1F7F3;display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}
.phead .who{min-width:0;flex:1}
.phead .who b{display:block;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .who span{font-size:12px;opacity:.8}
.phead select{max-width:130px;font-size:12px;border-radius:8px;border:0;padding:4px 6px;background:rgba(255,255,255,.14);color:#F1F7F3}
.phead select option{color:#16201C}
.msgs{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:86%;padding:7px 10px 5px;border-radius:10px;font-size:14px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.msg.bot{align-self:flex-start;background:var(--bubble-in);border-top-left-radius:3px}
.msg.cand{align-self:flex-end;background:var(--bubble-out);border-top-right-radius:3px}
.msg time{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.daysep{align-self:center;font-size:11.5px;background:var(--surface);color:var(--muted);border-radius:8px;padding:2px 9px;margin:4px 0}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 0}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--brand-ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.compose{display:flex;gap:8px;padding:8px 10px 10px}
.compose input{flex:1;min-width:0;border:0;border-radius:999px;padding:10px 14px;background:var(--surface)}
.compose button{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.pstart{margin:auto;text-align:center;padding:20px;color:var(--muted);font-size:14px;max-width:290px}
.pstart .btn{margin-top:10px}
.under{font-size:12.5px;color:var(--muted);margin-top:10px;padding:0 6px;text-align:center}
.under code{font-size:12px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
.demo{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.msg{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}}}

/* ---------- colour pass: every tab has its own colour, café doodles, warmer page ---------- */
body{background:
  radial-gradient(520px 360px at -4% -6%, var(--blob1), transparent 70%),
  radial-gradient(520px 420px at 104% 4%, var(--blob2), transparent 70%),
  radial-gradient(600px 420px at 40% 108%, var(--blob3), transparent 70%), var(--bg);background-repeat:no-repeat}
.chip{background:var(--surface)}
.chip.live{border-color:var(--brand);color:var(--brand-ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.panel{box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(40,30,10,.35);overflow:hidden}
.owner-col{--acc:var(--brand);--acc-soft:var(--brand-soft);--acc-ink:var(--brand-ink)}
.owner-col[data-tab="ret"]{--acc:var(--coral);--acc-soft:var(--coral-soft);--acc-ink:var(--coral-ink)}
.owner-col[data-tab="vac"]{--acc:var(--sky);--acc-soft:var(--sky-soft);--acc-ink:var(--sky-ink)}
.owner-col[data-tab="fb"]{--acc:var(--grape);--acc-soft:var(--grape-soft);--acc-ink:var(--grape-ink)}
.owner-col{border-top:5px solid var(--acc);transition:border-color .25s}

/* vacancy header with doodles */

// ---------- data layer ----------
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function act(action){
  if (api) {
    return fetch("api/action", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(action) })
      .then(function(r){ if (!r.ok) throw new Error(); return r.json(); })
      .then(function(d){ state = d.state; afterChange(); })
      .catch(function(){ toast(t("errSave")); });
  }
  action.now = Date.now();
  state = HF.apply(state, action).state;
  saveLocal(); afterChange();
  return Promise.resolve();
}
function afterChange(){
  if (state.lastCreated && !state.vacancies.some(function(v){ return v.id === ui.vacancyId; })) ui.vacancyId = state.lastCreated;
  render();
}
function boot(){
  var done = false;
  var timer = setTimeout(function(){ if (!done) { done = true; startLocal(); } }, 2500);
  fetch("api/state", { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error();
    return r.json();
  }).then(function(d){
    if (done || !d || !d.state) throw new Error();
    done = true; clearTimeout(timer);
    api = true; live = !!d.live; waNumber = d.waNumber || ""; state = d.state;
    if (!state.vacancies.length) return act({ type:"reset", seed:true, lang: ui.lang });
    render();
    setInterval(poll, 4000);
  }).catch(function(){ if (!done) { done = true; clearTimeout(timer); startLocal(); } });
}
function poll(){
  if (document.hidden) return;
  fetch("api/state", { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.state && d.state.updatedAt !== state.updatedAt) { state = d.state; render(); }
  }).catch(function(){});
}
function startLocal(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  state = s && s.vacancies ? s : HF.seed(Date.now(), ui.lang);
  saveLocal(); render();
}

function render(){
  document.documentElement.lang = ui.lang;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i")); });
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === ui.lang)); });
  var m = $("mode"); m.className = "chip" + (live ? " live" : "");
  $("modeText").textContent = api ? (live ? t("live") : t("server")) : t("demo");
  var vs = $("vsel"), v = curV();
  vs.innerHTML = state.vacancies.map(function(x){ return '<option value="' + x.id + '"' + (v && x.id === v.id ? " selected" : "") + ">" + esc(x.role + " · " + x.cafe + " · " + x.code) + "</option>"; }).join("");
  vs.hidden = state.vacancies.length < 2;
  renderHead(v); renderPanel(v); renderPhone(v);
}

function renderPanel(v){
  document.querySelectorAll("button[data-tab]").forEach(function(b){ b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === ui.tab)); });

  var p = $("panel");
  if (ui.tab === "cands") p.innerHTML = v ? candsHTML(v) : vacHTML(null);
  else if (ui.tab === "ret") p.innerHTML = retHTML(v);

}

function confetti(){

    var cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
    var W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext("2d");
    var cols = ["#0E7A55", "#E8A51C", "#E85D3F", "#2F7FD0", "#6F52D9", "#D6478A"], ps = [];
    for (var i = 0; i < 90; i++) ps.push({ x: W / 2, y: H / 3, vx: (Math.random() - .5) * 12, vy: Math.random() * -10 - 3, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6 });
    var n = 0;
    (function frame(){
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function(p){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (++n < 90) requestAnimationFrame(frame); else cv.remove();
    })();
  } catch (e) {}
}

  if (el.hasAttribute("data-lang")) { ui.lang = el.getAttribute("data-lang"); try { localStorage.setItem(LKEY, ui.lang); } catch (x) {} render(); return; }
  if (el.hasAttribute("data-tab") && el.tagName === "BUTTON") { ui.tab = el.getAttribute("data-tab"); render(); return; }
  if (el.hasAttribute("data-show")) { $("grid").setAttribute("data-show", el.getAttribute("data-show")); document.querySelectorAll("[data-show]").forEach(function(b){ if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b === el)); }); return; }
  if (el.hasAttribute("data-filter")) { ui.filter = el.getAttribute("data-filter"); render(); return; }
  if (el.hasAttribute("data-quick")) { sendSim(el.getAttribute("data-quick")); return; }
  var a = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if (!a) return;
  if (a === "toggle") { ui.open[id] = !ui.open[id]; render(); return; }
  if (a === "askInvite") { ui.inviteFor = id; render(); var si = $("slot-" + id); if (si) { si.focus(); si.select(); } return; }
  if (a === "invite") { ui.inviteFor = null; var s = $("slot-" + id); act({ type:"invite", id:id, slot: (s && s.value.trim()) || t("slot") }); return; }
  if (a === "remind") { act({ type:"remind", id:id }); return; }
  if (a === "came" || a === "noshow") { act({ type:"mark", id:id, status:a }); return; }
  if (a === "hire") { confetti(); act({ type:"mark", id:id, status:"hired" }); return; }
  if (a === "reject") { act({ type:"mark", id:id, status:"rejected" }); return; }
  if (a === "checkin") { ui.simId = id; act({ type:"checkin", id:id, day: +el.getAttribute("data-day") }); return; }
  if (a === "leftAsk") { ui.leftFor = ui.leftFor === id ? null : id; render(); return; }
  if (a === "left") { var r = $("reason-" + id); ui.leftFor = null; act({ type:"ownerCheck", id:id, day:30, stayed:false, reason: +(r && r.value) || 6 }); return; }
  if (a === "seed") { ui.simId = null; ui._simInit = false; act({ type:"reset", seed:true, lang: ui.lang }); return; }
  if (a === "empty") { ui.simId = null; act({ type:"reset", seed:false }); ui.tab = "vac"; return; }
  if (a === "newV") { ui.vacancyId = "__new"; renderPanelNew(); return; }
  if (a === "simStart") { var v = curV(); if (v) sendSim((v.lang === "en" ? "Hello! " : "Здравствуйте! ") + v.code); return; }
  if (a === "copy") {
    var txt = $("walink").textContent;
    try { navigator.clipboard.writeText(txt).then(function(){ toast(t("copied")); }, function(){ selectText($("walink")); }); } catch (x) { selectText($("walink")); }
    return;
  }
});
function selectText(n){ var r = document.createRange(); r.selectNodeContents(n); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function renderPanelNew(){ $("panel").innerHTML = vacHTML(null); }
document.addEventListener("submit", function(e){
  if (e.target.id === "compose") { e.preventDefault(); var i = $("msgIn"); var v = i.value.trim(); i.value = ""; sendSim(v); return; }
  if (e.target.id === "vform") {
    e.preventDefault();
    var f = e.target, data = {};
    ["cafe","role","area","shiftsPerWeek","hours","pay","start","workload","lang"].forEach(function(k){ data[k] = f.elements[k].value.trim(); });
    data.days = Array.prototype.filter.call(f.querySelectorAll('input[name="days"]'), function(x){ return x.checked; }).map(function(x){ return +x.value; });
    var id = f.getAttribute("data-id");
    if (id) act({ type:"updateVacancy", id:id, data:data }).then(function(){ toast(t("saved")); });
    else act({ type:"createVacancy", data:data }).then(function(){ ui.vacancyId = state.lastCreated; ui.simId = null; ui.tab = "cands"; render(); toast(t("created")); });
    return;
  }
  if (e.target.id === "fbform") {
    e.preventDefault();
    var g = e.target, val = function(n){ var x = g.querySelector('[name="' + n + '"]:checked') || g.elements[n]; return x ? x.value : ""; };
    act({ type:"feedback", data:{ role: val("role"), ease: val("ease"), pay: val("pay"), useful: g.elements.useful.value, missing: g.elements.missing.value.trim().slice(0, 600), lang: ui.lang } }).then(function(){ toast(t("thanks")); });
  }
});
$("vsel").addEventListener("change", function(e){ ui.vacancyId = e.target.value; ui.simId = null; ui._simInit = false; render(); });
$("csel").addEventListener("change", function(e){ ui.simId = e.target.value || null; ui._simInit = true; render(); });

boot();
})();
</script>
